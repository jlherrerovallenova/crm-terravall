<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 115" width="100%" height="100%">
  <style>
    .brand-text { font-family: 'Inter', 'Arial Black', Arial, sans-serif; font-weight: 900; fill: #8f1505; letter-spacing: -2px; }
    .sub-text { font-family: 'Inter', Arial, sans-serif; font-weight: 700; fill: #ffffff; letter-spacing: 3.8px; font-size: 13.5px; }
    .house-accent { fill: #8f1505; }
  </style>

  <!-- TERRAVALL TEXT -->
  <g transform="translate(10, 65)">
    <!-- T -->
    <text x="0" y="0" font-size="58" class="brand-text">T</text>
    <!-- E -->
    <text x="35" y="0" font-size="58" class="brand-text">E</text>
    <!-- R -->
    <text x="73" y="0" font-size="58" class="brand-text">R</text>
    <!-- R -->
    <text x="115" y="0" font-size="58" class="brand-text">R</text>
    <!-- A -->
    <text x="157" y="0" font-size="58" class="brand-text">A</text>
    <!-- V -->
    <text x="202" y="0" font-size="58" class="brand-text">V</text>
    
    <!-- HOUSE "A" (The second A in TERRAVALL) -->
    <g transform="translate(248, -48)">
      <!-- Chimney -->
      <rect x="29" y="3" width="5" height="11" class="house-accent" />
      <!-- House base -->
      <path d="M 20 0 L 40 20 L 40 46 L 0 46 L 0 20 Z" class="house-accent" />
      <!-- Roof trim -->
      <path d="M 20 -3 L 44 21 L 39 24 L 20 5 L 1 24 L -4 21 Z" class="house-accent" />
      <!-- Top Window inside peak -->
      <rect x="16" y="16" width="8" height="8" fill="#ffffff" />
      <line x1="20" y1="16" x2="20" y2="24" stroke="#8f1505" stroke-width="1.5" />
      <line x1="16" y1="20" x2="24" y2="20" stroke="#8f1505" stroke-width="1.5" />
      
      <!-- Door/Bottom Window -->
      <rect x="15" y="32" width="10" height="14" fill="#ffffff" />
    </g>
    
    <!-- 3 squares below house A -->
    <g transform="translate(248, 4)">
      <!-- Left Square -->
      <rect x="2" y="4" width="6" height="6" class="house-accent" />
      <!-- Right Square -->
      <rect x="32" y="4" width="6" height="6" class="house-accent" />
      <!-- Center Square (lower) -->
      <rect x="17" y="12" width="6" height="6" class="house-accent" />
    </g>
    
    <!-- L -->
    <text x="296" y="0" font-size="58" class="brand-text">L</text>
    <!-- L -->
    <text x="328" y="0" font-size="58" class="brand-text">L</text>
  </g>

  <!-- RED BANNER WITH WHITE SUBTITLE TEXT -->
  <rect x="5" y="78" width="372" height="25" fill="#8f1505" />
  <text x="191" y="95.5" text-anchor="middle" class="sub-text">SERVICIOS INMOBILIARIOS</text>
</svg>
